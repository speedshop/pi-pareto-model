[tools]
node = "22.22.3"

[tasks.test]
description = "Run the test suite"
sources = ["src/**/*", "scripts/**/*", "schema/**/*", "test/**/*", "visualization/**/*"]
run = "npm run check"

[tasks.build]
description = "Build the page from a catalog URL (default: the public DeepSWE catalog)"
usage = '''
flag "--url <url>" default="https://raw.githubusercontent.com/speedshop/ds-catalog-digest/main/catalog/model-selection-catalog.json"
flag "--output <output>" default="preset-map.html"
flag "--strings <strings>"
flag "--allow-restricted"
'''
run = 'node scripts/build-preset-map.mjs --url "$usage_url" --output "$usage_output"${usage_strings:+ --strings "$usage_strings"}${usage_allow_restricted:+ --allow-restricted}'

[tasks."build:aa"]
description = "Build the AA-derived page from all measurement-free subscription snapshots"
run = "node scripts/build-preset-map.mjs --rankings data/aa-rankings.json --output preset-map-aa.html && node scripts/check-derived-page.mjs preset-map-aa.html"

[tasks."refresh:aa"]
description = "Privately recompute all four AA subscription snapshots from a local catalog"
usage = '''
flag "--catalog <catalog>" default="tmp/aa-catalog.json"
'''
run = 'node scripts/build-preset-map.mjs --catalog "$usage_catalog" --derived --export-rankings data/aa-rankings.json --output preset-map-aa.html && node scripts/check-derived-page.mjs preset-map-aa.html'
