<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pageTitle"></title>
  <style>
    :root {
      --paper: #f5f3ee;
      --ink: #15171b;
      --muted: #656b76;
      --slate: #5c6574;
      --rule: rgba(25, 29, 35, 0.14);
      --card: rgba(255, 255, 255, 0.46);
      --bar: #3d4654;
      --bar-track: rgba(25, 29, 35, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 7%, rgba(255, 255, 255, 0.9), transparent 30rem),
        radial-gradient(circle at 85% 80%, rgba(213, 207, 194, 0.24), transparent 34rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 940px);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 42px) clamp(8px, 2vw, 20px) 34px;
    }

    header {
      margin-bottom: 2px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.2vw, 1.6rem);
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: clamp(0.74rem, 1.4vw, 0.9rem);
    }

    header .narrow { display: none; }

    button, input { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .map {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      touch-action: none;
      user-select: none;
    }

    .hex {
      cursor: pointer;
      outline: none;
    }

    .hex polygon {
      stroke: rgba(245, 243, 238, 0.35);
      stroke-width: 1.5;
      stroke-linejoin: round;
      transition: filter 150ms ease, opacity 150ms ease;
      vector-effect: non-scaling-stroke;
    }

    .hex:hover polygon,
    .hex:focus-visible polygon,
    .hex.active polygon {
      filter: saturate(1.09) brightness(1.04) drop-shadow(0 5px 6px rgba(20, 24, 30, 0.22));
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 3;
    }

    #labels { pointer-events: none; }

    #marker {
      cursor: grab;
      pointer-events: all;
    }

    .hex-label {
      font-size: 13px;
      font-weight: 950;
      letter-spacing: -0.045em;
      line-height: 1;
      text-anchor: middle;
      text-rendering: geometricPrecision;
    }

    .hex-label .qualifier {
      font-size: 10px;
      font-weight: 850;
      letter-spacing: -0.02em;
    }

    .pole rect { fill: var(--slate); }
    .pole text {
      fill: #fff;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: 0.025em;
      text-anchor: middle;
    }

    .triangle-outline {
      fill: none;
      stroke: rgba(55, 62, 73, 0.26);
      stroke-width: 2;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }

    #marker circle.outer {
      fill: none;
      stroke: var(--ink);
      stroke-width: 5;
    }

    #marker circle.inner {
      fill: none;
      stroke: #fff;
      stroke-width: 2.5;
    }

    .panel {
      width: min(100% - 20px, 790px);
      margin: 0 auto;
      padding: 17px 20px;
      border: 1px solid var(--rule);
      border-radius: 17px;
      background: var(--card);
      box-shadow: 0 14px 42px rgba(45, 43, 37, 0.06);
    }

    .controls {
      display: grid;
      gap: 14px;
      margin-top: -4px;
    }

    .controls > * { min-width: 0; }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .caption {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .chip {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 4px 11px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }

    .winner .model {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }

    .winner .model .name, .winner .model .creator { overflow-wrap: anywhere; }

    .winner-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 0;
      font-variant-numeric: tabular-nums;
    }

    .winner-metrics dt {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .winner-metrics dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .winner-metrics .value {
      font-size: 1.05rem;
      font-weight: 850;
    }

    .winner-metrics .unit {
      color: var(--muted);
      font-size: 0.7rem;
    }

    .winner .caption { margin-top: 8px; }

    .creators summary {
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .creators summary .eyebrow {
      display: inline;
      margin: 0 6px 0 0;
    }

    .creators .caption { margin-top: 8px; }

    .creator-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .creator-actions .chip { padding: 3px 11px; }

    .creator-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 0.78rem;
    }

    .creator-list label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 0;
      border: 0;
      background: var(--rule);
    }

    .table-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
    }

    .table-tools input[type="search"] {
      flex: 1 1 14rem;
      padding: 5px 12px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
    }

    .table-tools label { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    caption {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-align: left;
    }

    th {
      padding: 5px 8px;
      border-bottom: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: left;
      text-transform: uppercase;
    }

    td {
      padding: 5px 8px;
      border-bottom: 1px solid rgba(25, 29, 35, 0.06);
      vertical-align: middle;
    }

    td.rank, th.rank { width: 2.2rem; text-align: right; }
    td.rank { color: var(--muted); font-weight: 800; }

    .model { display: flex; gap: 8px; align-items: center; }

    .swatch {
      flex: none;
      width: 11px;
      height: 11px;
      border-radius: 3px;
    }

    .model .name { font-weight: 800; }
    .model .creator, .model .dominator { color: var(--muted); font-weight: 500; }
    .model .dominator { display: block; font-size: 0.68rem; }

    .why-toggle {
      display: block;
      margin-top: 2px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .why-toggle::before {
      content: "";
      display: inline-block;
      margin-right: 5px;
      border-top: 3.5px solid transparent;
      border-bottom: 3.5px solid transparent;
      border-left: 5px solid currentColor;
      vertical-align: 1px;
      transition: transform 150ms ease;
    }

    .why-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }

    .why-row[hidden] { display: none; }

    .why-row td { padding: 2px 8px 10px 3rem; }

    .why {
      max-width: 40rem;
      color: var(--ink);
      font-size: 0.75rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .why p { margin: 0 0 6px; }

    .why ul {
      margin: 0 0 6px;
      padding: 0;
      list-style: none;
    }

    .why li {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 8px;
      padding: 2px 0;
    }

    .why .why-axis { min-width: 9rem; font-weight: 800; }
    .why .why-value { font-weight: 800; }
    .why .why-off { color: var(--muted); }

    .why .why-limit {
      padding: 0 6px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
    }

    .empty-row td {
      padding: 14px 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .metric {
      display: grid;
      grid-template-columns: 3.2rem 3.4rem;
      gap: 6px;
      align-items: center;
    }

    .metric .value { text-align: right; }

    .microbar {
      height: 6px;
      border-radius: 3px;
      background: var(--bar-track);
      overflow: hidden;
    }

    .microbar span {
      display: block;
      height: 100%;
      background: var(--bar);
    }

    td.regret { text-align: right; }

    tr.top td { background: rgba(255, 255, 255, 0.75); }
    tr.top td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
    tr.flash td { animation: flash 900ms ease; }
    tr.dominated td:not(.model-cell),
    tr.dominated .model-cell .swatch,
    tr.dominated .model-cell .name,
    tr.dominated .model-cell .creator,
    tr.dominated .model-cell .dominator { opacity: 0.48; }

    @keyframes flash {
      from { background: rgba(255, 228, 140, 0.85); }
    }

    .explainer {
      width: min(100% - 32px, 38rem);
      margin: 30px auto 0;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .explainer h2 {
      margin: 22px 0 6px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .explainer p { margin: 0 0 10px; }

    .explainer a { color: inherit; font-weight: 700; }

    footer {
      margin-top: 13px;
      color: #7b8088;
      font-size: 0.68rem;
      line-height: 1.45;
      text-align: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .legend, .summary { display: none; }

    .legend {
      flex-wrap: wrap;
      gap: 4px 12px;
      margin: 2px 0 14px;
      padding: 0 12px;
      list-style: none;
      font-size: 0.8125rem;
      font-weight: 700;
    }

    .legend li { display: flex; gap: 6px; align-items: center; }

    .summary {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 1;
      gap: 4px;
      padding: 8px 12px;
      border-top: 1px solid var(--rule);
      background: rgba(245, 243, 238, 0.97);
      box-shadow: 0 -8px 24px rgba(45, 43, 37, 0.08);
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
    }

    .summary .model { margin: 0; }

    .summary-axes {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .summary-axes .axis {
      display: block;
      color: var(--muted);
      font-size: 0.6875rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .summary-axes .value { font-weight: 850; }

    @media (max-width: 600px) {
      body { font-size: 14px; }
      main { padding-right: 0; padding-left: 0; }
      header, footer { padding: 0 12px; }
      header .narrow { display: block; font-size: 0.875rem; }
      #labels { visibility: hidden; }
      .legend { display: flex; }
      .summary { display: grid; }
      .hex polygon { stroke-width: 0.75; }
      .explainer { font-size: 14px; }
      #marker circle { r: 14px; }
      .caption, caption, .winner-metrics .unit { font-size: 0.75rem; }
      .chip, .table-tools { font-size: 0.8125rem; }
      .table-scroll { overflow-x: visible; }
      table { font-size: 0.8125rem; }
      table, caption, thead, tbody { display: block; }

      tr {
        display: grid;
        grid-template-columns: 1.75rem repeat(3, minmax(0, 1fr));
      }

      th, .winner-metrics dt { font-size: 0.6875rem; }
      th, td { border-bottom: 0; }
      thead tr { border-bottom: 1px solid var(--rule); }
      tbody tr { border-bottom: 1px solid rgba(25, 29, 35, 0.06); }
      td.rank, th.rank { width: auto; padding-right: 4px; padding-left: 4px; }
      td.rank { grid-row: 1 / 3; }
      tbody td:nth-child(2) { grid-column: 2 / -1; padding-bottom: 2px; }
      tbody td:nth-child(n + 3) { grid-row: 2; padding-top: 2px; }
      td:nth-child(3), th:nth-child(3) { grid-column: 2; }
      td:nth-child(4), th:nth-child(4) { grid-column: 3; }
      td:nth-child(5), th:nth-child(5) { grid-column: 4; }
      thead th:nth-child(2), .regret { display: none; }
      .metric { grid-template-columns: minmax(0, 1fr); gap: 3px; }
      .metric .value { text-align: left; }
      .model .name, .model .dominator { overflow-wrap: anywhere; }
      .why-row, .empty-row { display: block; }
      .why-row td { display: block; padding: 0 8px 10px 2.25rem; }
      .empty-row td { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="heading"></h1>
      <p class="narrow" data-i18n="mobileHint"></p>
    </header>

    <svg class="map" viewBox="0 0 800 700" role="group" aria-labelledby="map-title map-description">
      <title id="map-title" data-i18n="mapTitle"></title>
      <desc id="map-description" data-i18n="mapDescription"></desc>
      <defs>
        <clipPath id="triangle-clip">
          <path d="M400 70 L72 636 L728 636 Z" />
        </clipPath>
        <filter id="paper-grain" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="11" result="noise" />
          <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
          <feComponentTransfer in="gray" result="faint-noise">
            <feFuncA type="table" tableValues="0 0.055" />
          </feComponentTransfer>
          <feBlend in="SourceGraphic" in2="faint-noise" mode="multiply" />
        </filter>
      </defs>

      <g id="hexes" clip-path="url(#triangle-clip)" filter="url(#paper-grain)"></g>
      <path class="triangle-outline" d="M400 70 L72 636 L728 636 Z" />
      <g id="labels"></g>
      <g id="marker">
        <circle class="outer" r="9" />
        <circle class="inner" r="9" />
      </g>

      <g class="pole" transform="translate(364 22)">
        <rect width="72" height="31" rx="15.5" />
        <text x="36" y="21" data-i18n="poleTime"></text>
      </g>
      <g class="pole" transform="translate(9 646)">
        <rect width="84" height="31" rx="15.5" />
        <text x="42" y="21" data-i18n="poleSmart"></text>
      </g>
      <g class="pole" transform="translate(707 646)">
        <rect width="76" height="31" rx="15.5" />
        <text x="38" y="21" data-i18n="poleCost"></text>
      </g>
    </svg>

    <ol class="legend" id="legend" data-i18n-aria-label="legendLabel"></ol>

    <section class="panel controls">
      <div class="winner">
        <p class="eyebrow" data-i18n="winnerHeading"></p>
        <p class="model"><span class="swatch" id="winner-swatch"></span><span><span class="name" id="winner-name"></span> <span class="creator" id="winner-creator"></span></span></p>
        <dl class="winner-metrics" id="winner-metrics"></dl>
        <p class="caption" data-i18n="winnerNote"></p>
      </div>
      <details class="creators">
        <summary><span class="eyebrow" data-i18n="creatorsHeading"></span> <span id="creator-count"></span></summary>
        <p class="caption" data-i18n="creatorsHint"></p>
        <div class="creator-actions">
          <button type="button" class="chip" id="creators-all" data-i18n="creatorsSelectAll"></button>
          <button type="button" class="chip" id="creators-none" data-i18n="creatorsClear"></button>
        </div>
        <fieldset class="creator-list" id="creator-list">
          <legend class="visually-hidden" data-i18n="creatorsLegend"></legend>
        </fieldset>
      </details>
      <hr class="divider">
      <div>
        <div class="table-tools">
          <input id="search" type="search" data-i18n-placeholder="filterPlaceholder" data-i18n-aria-label="filterLabel">
          <label><input id="show-dominated" type="checkbox"> <span data-i18n="showDominated"></span></label>
        </div>
        <div class="table-scroll">
          <table>
            <caption id="table-caption" aria-live="polite"></caption>
            <thead>
              <tr>
                <th class="rank" scope="col" data-i18n="columnRank"></th>
                <th scope="col" data-i18n="columnModel"></th>
                <th scope="col" data-i18n="columnSmart"></th>
                <th scope="col" data-i18n="columnTime"></th>
                <th scope="col" data-i18n="columnCost"></th>
                <th scope="col" class="regret" data-i18n="columnRegret"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <article class="explainer" id="explainer"></article>

    <footer>
      <span data-i18n="footerMethod"></span><br>
      <span id="source-note"></span>
    </footer>
  </main>

  <div class="summary" role="status" aria-live="off" data-i18n-aria-label="summaryLabel">
    <p class="model"><span class="swatch" id="summary-swatch"></span><span><span class="name" id="summary-name"></span> <span class="creator" id="summary-creator"></span></span></p>
    <div class="summary-axes" id="summary-axes"></div>
  </div>

  <script>
__RANKING_MODULE__

    const mapData = __PRESET_MAP_DATA__;
    const strings = __STRINGS__;
    const { catalog, variants } = mapData;

    function t(key, vars = {}) {
      const fillIn = (text) => text.replace(/\{(\w+)\}/g, (match, name) => vars[name] ?? match);
      return Array.isArray(strings[key]) ? strings[key].map(fillIn) : fillIn(strings[key]);
    }

    document.querySelectorAll("[data-i18n]").forEach((element) => {
      element.textContent = t(element.dataset.i18n);
    });
    ["placeholder", "aria-label"].forEach((attribute) => {
      document.querySelectorAll(`[data-i18n-${attribute}]`).forEach((element) => {
        element.setAttribute(attribute, t(element.getAttribute(`data-i18n-${attribute}`)));
      });
    });

    const AXIS_LABELS = { smart: t("axisSmart"), fast: t("axisTime"), cheap: t("axisCost") };
    const HASH_KEYS = { smart: "s", fast: "t", cheap: "c" };
    const INITIAL_ALLOCATION = { smart: 7.25, fast: 3.25, cheap: 1.5 };
    const CREATORS_KEY = "pareto-model-creators";
    const EMPTY_HEX_COLOR = "#d6d2c8";
    const triangle = {
      smart: { x: 72, y: 636 },
      fast: { x: 400, y: 70 },
      cheap: { x: 728, y: 636 },
    };
    const CREATOR_HUES = {
      xAI: 15,
      SpaceXAI: 15,
      Anthropic: 55,
      "Z AI": 95,
      "Z.ai": 95,
      Alibaba: 135,
      OpenAI: 175,
      "Moonshot AI": 215,
      Kimi: 215,
      Google: 255,
      Meta: 295,
      DeepSeek: 335,
    };
    const THINKING_LEVELS = ["off", "minimal", "low", "medium", "high", "xhigh", "max"];

    function thinkingLevel(label) {
      const level = label?.toLowerCase().replace(/^(none|non-reasoning)$/, "off");
      return level === "reasoning" || THINKING_LEVELS.includes(level) ? level : undefined;
    }

    function modelFamily(name) {
      let label;
      const family = name.replace(/\s*\(([^)]*)\)/g, (match, qualifier) => {
        const level = qualifier.match(/\b(minimal|low|medium|high|xhigh|max) effort\b/i)
          ?? qualifier.match(/\b(non-reasoning|reasoning|none|off|minimal|low|medium|high|xhigh|max)\b/i);
        if (!level) return match;
        label ??= level[1];
        return "";
      }).trim();
      return { family, label };
    }

    function oklchColor(lightness, chroma, hue) {
      const linear = (amount) => {
        const a = amount * Math.cos(hue * Math.PI / 180);
        const b = amount * Math.sin(hue * Math.PI / 180);
        const [l, m, s] = [
          lightness + 0.3963377774 * a + 0.2158037573 * b,
          lightness - 0.1055613458 * a - 0.0638541728 * b,
          lightness - 0.0894841775 * a - 1.291485548 * b,
        ].map((value) => value ** 3);
        return [
          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
        ];
      };
      const inGamut = (amount) => linear(amount).every((channel) => channel >= 0 && channel <= 1);
      let [fitted, ceiling] = inGamut(chroma) ? [chroma, chroma] : [0, chroma];
      for (let step = 0; step < 12 && fitted < ceiling; step += 1) {
        const middle = (fitted + ceiling) / 2;
        if (inGamut(middle)) fitted = middle;
        else ceiling = middle;
      }
      const rgb = linear(fitted).map((channel) => Math.round(255 * Math.min(1, Math.max(0,
        channel <= 0.0031308 ? 12.92 * channel : 1.055 * channel ** (1 / 2.4) - 0.055))));
      const luminance = rgb.map((channel) => {
        const value = channel / 255;
        return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
      }).reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0);
      const angle = hue * Math.PI / 180;
      const lab = [lightness, fitted * Math.cos(angle), fitted * Math.sin(angle)];
      return [`rgb(${rgb.join(", ")})`, luminance > 0.179 ? "#000000" : "#ffffff", lab];
    }

    const FAMILY_SHADES = [-18, -6, 6, 18].flatMap((offset) => [1, 0.6].flatMap((saturation) => [-0.07, -0.025, 0.025, 0.07].map((lift) => [offset, saturation, lift])));

    function assignModelColors(models) {
      const families = new Map();
      models.forEach((model) => {
        const { family, label } = modelFamily(model.name);
        const level = thinkingLevel(model.reasoning) ?? thinkingLevel(label);
        const key = `${model.creator}\n${family}`;
        const shade = level === undefined || level === "reasoning" ? 3.5 : THINKING_LEVELS.indexOf(level);
        families.set(key, [...(families.get(key) ?? []), { model, shade }]);
      });
      const placed = [];
      [...families.keys()].sort((left, right) => left.localeCompare(right)).forEach((key) => {
        const members = families.get(key);
        const { creator } = members[0].model;
        const hash = Array.from(creator).reduce((value, character) =>
          (Math.imul(value, 31) + character.charCodeAt(0)) >>> 0, 0);
        const [hue, chroma] = creator in CREATOR_HUES ? [CREATOR_HUES[creator], 0.16] : [35 + (hash % 9) * 40, 0.13];
        const options = FAMILY_SHADES.map(([offset, saturation, lift]) =>
          members.map(({ shade }) => oklchColor(0.86 + lift - shade * 0.075, chroma * saturation, hue + offset)));
        const distance = (colors) => colors.reduce((nearest, [, , lab]) => placed.reduce((closest, other) =>
          Math.min(closest, (lab[0] - other[0]) ** 2 + (lab[1] - other[1]) ** 2 + (lab[2] - other[2]) ** 2), nearest), Infinity);
        const best = options.reduce((chosen, colors) => {
          const separation = distance(colors);
          return separation > chosen.separation ? { colors, separation } : chosen;
        }, { separation: -1 }).colors;
        members.forEach(({ model }, index) => {
          [model.color, model.ink] = best[index];
          placed.push(best[index][2]);
        });
      });
    }

    function compactQualifier(parenthetical) {
      const effort = parenthetical.match(/(low|medium|high|xhigh|max) effort/i)?.[1]
        ?? parenthetical.match(/^(low|medium|high|xhigh|max)$/i)?.[1];
      if (effort) return effort.toLowerCase();
      return parenthetical.match(/non-reasoning/i) ? "non-reasoning" : "";
    }

    function compactLabel(name) {
      const parenthetical = name.match(/\(([^)]*)\)/)?.[1] ?? "";
      const qualifier = compactQualifier(parenthetical);
      const base = name.replace(/\s*\([^)]*\).*$/, "").replace(/^Claude\s+/, "");
      const words = base.split(/\s+/);
      if (words.length < 3) return qualifier ? [base, qualifier] : [base];
      const split = Math.ceil(words.length / 2);
      const lines = [words.slice(0, split).join(" "), words.slice(split).join(" ")];
      if (qualifier) lines[1] += ` · ${qualifier}`;
      return lines;
    }

    assignModelColors(variants);
    const variantsById = new Map(variants.map((variant) => [variant.id, variant]));

    function svgElement(name, attributes = {}) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
      return element;
    }

    function htmlElement(name, attributes = {}, text) {
      const element = document.createElement(name);
      Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function allocationPoint(allocation) {
      return AXES.reduce((point, axis) => ({
        x: point.x + triangle[axis].x * allocation[axis] / TOTAL_POWER,
        y: point.y + triangle[axis].y * allocation[axis] / TOTAL_POWER,
      }), { x: 0, y: 0 });
    }

    function hexPoints(center, radius) {
      return Array.from({ length: 6 }, (_, index) => {
        const angle = (-90 + index * 60) * Math.PI / 180;
        return `${center.x + radius * Math.cos(angle)},${center.y + radius * Math.sin(angle)}`;
      }).join(" ");
    }

    function formatPower(value) {
      return Number(value.toFixed(2)).toString();
    }

    function describePriorities(allocation) {
      const axes = enabledAxes(allocation);
      if (axes.length === 1) return t("priorityOnly", { axis: AXIS_LABELS[axes[0]] });
      if (axes.length === 3 && axes.every((axis) => allocation[axis] === allocation.smart)) return t("priorityAllEqual");
      const levels = [...new Set(axes.map((axis) => allocation[axis]))].sort((left, right) => right - left);
      const order = levels.map((level) => {
        const tied = axes.filter((axis) => allocation[axis] === level).map((axis) => AXIS_LABELS[axis]);
        return tied.length > 1 ? t("priorityEqual", { axes: tied.join(t("priorityAxisJoin")) }) : tied[0];
      }).join(t("priorityThen"));
      const ignored = AXES.filter((axis) => !axes.includes(axis)).map((axis) => AXIS_LABELS[axis]);
      return ignored.length === 0 ? order : t("priorityIgnored", { order, axes: ignored.join(t("priorityAxisJoin")) });
    }

    function metricUnit(axis) {
      return catalog.metricDefinitions[axis].unit.replaceAll("-", " ");
    }

    function sameAllocation(left, right) {
      return AXES.every((axis) => left[axis] === right[axis]);
    }

    const creatorNames = [...new Set(variants.map((variant) => variant.creator))]
      .sort((left, right) => left.localeCompare(right));

    function readCreators() {
      try {
        const stored = JSON.parse(localStorage.getItem(CREATORS_KEY));
        if (!Array.isArray(stored?.selected) || !Array.isArray(stored?.known)) return new Set(creatorNames);
        return new Set(creatorNames.filter((creator) =>
          stored.selected.includes(creator) || !stored.known.includes(creator)));
      } catch {
        return new Set(creatorNames);
      }
    }

    function writeCreators() {
      try {
        localStorage.setItem(CREATORS_KEY, JSON.stringify({ selected: [...selectedCreators], known: creatorNames }));
      } catch {}
    }

    let selectedCreators = readCreators();
    let eligible = variants.filter((variant) => selectedCreators.has(variant.creator));

    function ranked(allocation) {
      const axes = enabledAxes(allocation);
      const reference = paretoFront(variants, axes);
      const frontier = paretoFront(eligible, axes);
      return { axes, reference, frontier, ranking: rankVariants(frontier, allocation, axes, reference) };
    }

    const hexes = document.querySelector("#hexes");
    const labels = document.querySelector("#labels");
    const legend = document.querySelector("#legend");
    const radius = (triangle.smart.y - triangle.fast.y) / TOTAL_POWER / 1.5;
    const cells = [];

    for (let fast = TOTAL_POWER; fast >= 0; fast -= 1) {
      for (let smart = 0; smart <= TOTAL_POWER - fast; smart += 1) {
        const allocation = { smart, fast, cheap: TOTAL_POWER - fast - smart };
        const center = allocationPoint(allocation);
        const group = svgElement("g", { class: "hex", tabindex: "-1", role: "button" });
        const title = svgElement("title");
        const polygon = svgElement("polygon", { points: hexPoints(center, radius + 0.6) });
        group.append(title, polygon);
        hexes.append(group);
        cells.push({ group, title, polygon, allocation, center });
      }
    }

    function assignWinners() {
      cells.forEach((cell) => {
        const top = ranked(cell.allocation).ranking[0];
        cell.winner = top && variantsById.get(top.id);
        const names = { priorities: describePriorities(cell.allocation), model: cell.winner?.name ?? t("hexNoModel") };
        cell.group.setAttribute("aria-label", t("hexLabel", names));
        cell.title.textContent = t("hexTitle", names);
        cell.polygon.setAttribute("fill", cell.winner?.color ?? EMPTY_HEX_COLOR);
        cell.polygon.setAttribute("stroke", cell.winner?.color ?? EMPTY_HEX_COLOR);
      });
      labelledRegions = connectedRegions()
        .filter((region) => region.length > 1 && region[0].winner)
        .sort((left, right) => right.length - left.length);
    }

    function cellAt(allocation) {
      return cells.find((cell) => sameAllocation(cell.allocation, allocation));
    }

    function adjacent(left, right) {
      return AXES.reduce(
        (distance, axis) => distance + Math.abs(left.allocation[axis] - right.allocation[axis]),
        0,
      ) === 2;
    }

    function connectedRegions() {
      const unseen = new Set(cells);
      const regions = [];
      while (unseen.size > 0) {
        const seed = unseen.values().next().value;
        unseen.delete(seed);
        const region = [seed];
        for (let index = 0; index < region.length; index += 1) {
          const neighbors = [...unseen].filter((candidate) =>
            candidate.winner === seed.winner && adjacent(region[index], candidate));
          neighbors.forEach((neighbor) => unseen.delete(neighbor));
          region.push(...neighbors);
        }
        regions.push(region);
      }
      return regions;
    }

    function regionLayout(region) {
      const rawCenter = region.reduce((point, cell) => ({
        x: point.x + cell.center.x / region.length,
        y: point.y + cell.center.y / region.length,
      }), { x: 0, y: 0 });
      const boundaryFraction = region.filter((cell) =>
        Object.values(cell.allocation).some((value) => value === 0)).length / region.length;
      const inset = 0.04 + boundaryFraction * 0.14;
      const center = {
        x: rawCenter.x + (400 - rawCenter.x) * inset,
        y: rawCenter.y + (447.33 - rawCenter.y) * inset,
      };
      const xx = region.reduce((sum, cell) => sum + (cell.center.x - rawCenter.x) ** 2, 0);
      const yy = region.reduce((sum, cell) => sum + (cell.center.y - rawCenter.y) ** 2, 0);
      const xy = region.reduce(
        (sum, cell) => sum + (cell.center.x - rawCenter.x) * (cell.center.y - rawCenter.y),
        0,
      );
      const trace = xx + yy;
      const delta = Math.sqrt((xx - yy) ** 2 + 4 * xy ** 2);
      const elongation = trace === delta ? Infinity : (trace + delta) / Math.max(1, trace - delta);
      let angle = Math.atan2(2 * xy, xx - yy) * 90 / Math.PI;
      if (angle > 90) angle -= 180;
      if (angle < -90) angle += 180;
      const allowedAngles = [-60, 0, 60];
      const rotation = region.length >= 3 && elongation > 2.4
        ? allowedAngles.reduce((best, candidate) =>
          Math.abs(candidate - angle) < Math.abs(best - angle) ? candidate : best)
        : 0;
      return {
        x: center.x,
        y: center.y,
        rotation,
        fontSize: Math.min(25, 6 + Math.sqrt(region.length) * 4),
      };
    }

    function rotatedBounds(box, layout) {
      const angle = layout.rotation * Math.PI / 180;
      const corners = [[box.x, box.y], [box.x + box.width, box.y], [box.x, box.y + box.height], [box.x + box.width, box.y + box.height]]
        .map(([x, y]) => ({
          x: layout.x + (x - layout.x) * Math.cos(angle) - (y - layout.y) * Math.sin(angle),
          y: layout.y + (x - layout.x) * Math.sin(angle) + (y - layout.y) * Math.cos(angle),
        }));
      const xs = corners.map((corner) => corner.x);
      const ys = corners.map((corner) => corner.y);
      return { left: Math.min(...xs), right: Math.max(...xs), top: Math.min(...ys), bottom: Math.max(...ys) };
    }

    function intersects(left, right) {
      return left.left < right.right && right.left < left.right && left.top < right.bottom && right.top < left.bottom;
    }

    document.querySelectorAll(".pole").forEach((pole) => {
      const text = pole.querySelector("text");
      const rect = pole.querySelector("rect");
      const { e } = pole.transform.baseVal.consolidate().matrix;
      const width = text.getBBox().width + 24;
      const center = Math.min(Math.max(Number(text.getAttribute("x")), 9 - e + width / 2), 791 - e - width / 2);
      text.setAttribute("x", center);
      rect.setAttribute("x", center - width / 2);
      rect.setAttribute("width", width);
    });
    const poleBounds = [...document.querySelectorAll(".pole")].map((pole) => {
      const { e, f } = pole.transform.baseVal.consolidate().matrix;
      const box = pole.getBBox();
      return { left: e + box.x, right: e + box.x + box.width, top: f + box.y, bottom: f + box.y + box.height };
    });
    let placedLabels = [];

    function measuredLabel(winner, lines, layout) {
      const label = svgElement("g", {
        class: "hex-label",
        fill: winner.ink,
        style: `font-size:${layout.fontSize}px`,
        transform: `rotate(${layout.rotation} ${layout.x} ${layout.y})`,
      });
      const text = svgElement("text", {
        x: layout.x,
        y: layout.y - (lines.length - 1) * layout.fontSize * 0.38,
      });
      lines.forEach((line, index) => {
        const span = svgElement("tspan", {
          x: layout.x,
          dy: index === 0 ? 0 : layout.fontSize * 0.82,
          class: index === 0 ? "" : "qualifier",
          style: index === 0 ? "" : `font-size:${layout.fontSize * 0.68}px`,
        });
        span.textContent = line;
        text.append(span);
      });
      label.append(text);
      labels.append(label);
      const padding = 4;
      const measured = text.getBBox();
      const box = {
        x: measured.x - padding,
        y: measured.y - padding,
        width: measured.width + padding * 2,
        height: measured.height + padding * 2,
      };
      return { label, box, bounds: rotatedBounds(box, layout) };
    }

    function placeLabel(region) {
      const { winner } = region[0];
      const lines = compactLabel(winner.name);
      const layout = regionLayout(region);
      const distance = (point) => Math.hypot(point.x - layout.x, point.y - layout.y);
      const points = [layout, ...region.map((cell) => cell.center).sort((left, right) => distance(left) - distance(right))];
      for (const rotation of new Set([layout.rotation, 0])) {
        for (const fontSize of [layout.fontSize, Math.max(9, layout.fontSize * 0.8)]) {
          for (const point of points) {
            const { label, box, bounds } = measuredLabel(winner, lines, { ...layout, rotation, x: point.x, y: point.y, fontSize });
            if (placedLabels.some((placed) => intersects(placed, bounds))) {
              label.remove();
              continue;
            }
            placedLabels.push(bounds);
            label.prepend(svgElement("rect", { ...box, rx: 4, fill: winner.color }));
            const entry = htmlElement("li");
            entry.append(htmlElement("span", { class: "swatch", style: `background:${winner.color}` }), winner.name);
            legend.append(entry);
            return;
          }
        }
      }
    }

    let labelledRegions = [];

    function placeRegionLabels() {
      labels.replaceChildren();
      legend.replaceChildren();
      placedLabels = [...poleBounds];
      labelledRegions.forEach(placeLabel);
    }

    function parseHash() {
      const params = new URLSearchParams(location.hash.slice(1));
      const allocation = Object.fromEntries(AXES.map((axis) => {
        const value = params.get(HASH_KEYS[axis]) ?? "";
        return [axis, /^\d+(\.\d+)?$/.test(value) ? Number(value) : Number.NaN];
      }));
      return isPowerAllocation(allocation) ? allocation : { ...INITIAL_ALLOCATION };
    }

    let allocation = parseHash();
    let focusedCell = cellAt({ smart: 7, fast: 3, cheap: 2 }) ?? cells[0];
    focusedCell.group.setAttribute("tabindex", "0");

    function metricQuality(range, value) {
      if (range.min === range.max) return 1;
      const normalized = (value - range.min) / (range.max - range.min);
      return Math.max(0, Math.min(1, range.higherIsBetter ? normalized : 1 - normalized));
    }

    function metricRanges(rows) {
      return Object.fromEntries(AXES.map((axis) => {
        const values = rows.map((row) => row.metrics[axis]);
        return [axis, { min: Math.min(...values), max: Math.max(...values), higherIsBetter: axis === "smart" }];
      }));
    }

    function formatSmart(value) {
      if (Number.isInteger(value)) return String(value);
      return Math.abs(value) < 10 ? value.toFixed(3) : value.toFixed(1);
    }

    function formatTime(seconds) {
      const value = seconds >= 60 ? seconds / 60 : seconds;
      return t(seconds >= 60 ? "timeMinutes" : "timeSeconds", { value: value < 10 ? value.toFixed(1) : Math.round(value) });
    }

    function formatCost(value) {
      return t("cost", { value: value.toFixed(3) });
    }

    function metricCell(range, value, text) {
      const cell = htmlElement("td");
      const wrapper = htmlElement("div", { class: "metric" });
      const bar = htmlElement("span", { class: "microbar", "aria-hidden": "true" });
      bar.append(htmlElement("span", { style: `width:${(metricQuality(range, value) * 100).toFixed(1)}%` }));
      wrapper.append(htmlElement("span", { class: "value" }, text), bar);
      cell.append(wrapper);
      return cell;
    }

    const rowsBody = document.querySelector("#rows");
    const tableCaption = document.querySelector("#table-caption");
    const search = document.querySelector("#search");
    const showDominated = document.querySelector("#show-dominated");
    const winnerSwatches = document.querySelectorAll("#summary-swatch, #winner-swatch");
    const winnerNames = document.querySelectorAll("#summary-name, #winner-name");
    const winnerCreators = document.querySelectorAll("#summary-creator, #winner-creator");
    const summaryValues = Object.fromEntries(AXES.map((axis) => {
      const cell = htmlElement("div");
      const value = htmlElement("span", { class: "value" });
      cell.append(htmlElement("span", { class: "axis" }, AXIS_LABELS[axis]), value);
      document.querySelector("#summary-axes").append(cell);
      return [axis, value];
    }));
    const winnerValues = Object.fromEntries(AXES.map((axis) => {
      const item = htmlElement("div");
      const value = htmlElement("dd", { class: "value" });
      item.append(htmlElement("dt", {}, AXIS_LABELS[axis]), value, htmlElement("dd", { class: "unit" }, metricUnit(axis)));
      document.querySelector("#winner-metrics").append(item);
      return [axis, value];
    }));
    const formatMetric = { smart: formatSmart, fast: formatTime, cheap: formatCost };
    const expandedWhy = new Set();
    let flashTop = false;

    function renderSummary(top) {
      winnerSwatches.forEach((swatch) => { swatch.style.background = top ? variantsById.get(top.id).color : ""; });
      winnerNames.forEach((name) => { name.textContent = top ? top.name : t("summaryEmpty"); });
      winnerCreators.forEach((creator) => { creator.textContent = top ? top.creator : ""; });
      AXES.forEach((axis) => {
        summaryValues[axis].textContent = top ? formatMetric[axis](top.metrics[axis]) : t("emptyValue");
        winnerValues[axis].textContent = top ? formatAmount(top.metrics[axis]) : t("emptyValue");
      });
    }

    function formatRegret(value) {
      return value.toFixed(3);
    }

    function formatAmount(value) {
      return String(value >= 1000 ? Math.round(value) : Number(value.toPrecision(3)));
    }

    function metricDifference(axis, dominator, variant, considered) {
      const difference = dominator.metrics[axis] - variant.metrics[axis];
      const definition = catalog.metricDefinitions[axis];
      const higherIsBetter = definition.better === "higher";
      const key = difference === 0 ? "whyDifferenceSame"
        : difference > 0 ? (higherIsBetter ? "whyDifferenceHigherBetter" : "whyDifferenceHigherWorse")
          : (higherIsBetter ? "whyDifferenceLowerWorse" : "whyDifferenceLowerBetter");
      const item = htmlElement("li", {}, t(key, {
        axis: AXIS_LABELS[axis],
        amount: formatAmount(Math.abs(difference)),
        unit: metricUnit(axis),
      }));
      if (!considered) item.append(htmlElement("span", { class: "why-off" }, t("whyNotConsidered")));
      return item;
    }

    function whyDetails(variant, dominator, axes) {
      const { contributions, worstRegret } = variant.ranking;
      const limiting = worstRegret > 0 ? axes.filter((axis) => contributions[axis] === worstRegret) : [];
      const list = htmlElement("ul");
      AXES.forEach((axis) => {
        const item = htmlElement("li");
        item.append(htmlElement("span", { class: "why-axis" }, AXIS_LABELS[axis]));
        if (!axes.includes(axis)) {
          item.append(htmlElement("span", { class: "why-off" }, t("whyNotConsidered")));
        } else {
          item.append(htmlElement("span", { class: "why-value" }, formatRegret(contributions[axis])));
          if (limiting.includes(axis)) {
            item.append(htmlElement("span", { class: "why-limit" }, t(limiting.length > 1 ? "whyLimitingTied" : "whyLimiting")));
          }
        }
        list.append(item);
      });
      const score = t(limiting.length === 0 ? "whyNoRegret" : limiting.length > 1 ? "whyScoreTied" : "whyScore", {
        value: formatRegret(worstRegret),
        axes: limiting.map((axis) => AXIS_LABELS[axis]).join(t("whyAxisJoin")),
      });
      const body = htmlElement("div", { class: "why" });
      body.append(htmlElement("p", {}, t("whyIntro")), list, htmlElement("p", {}, score));
      if (dominator) {
        const differences = htmlElement("ul");
        differences.append(...AXES.map((axis) => metricDifference(axis, dominator, variant, axes.includes(axis))));
        body.append(htmlElement("p", {}, t("whyDominated", { name: dominator.name, creator: dominator.creator })), differences);
      }
      return body;
    }

    function renderTable() {
      const { axes, reference, frontier, ranking } = ranked(allocation);
      if (ranking.length === 0) {
        tableCaption.textContent = t("captionEmpty");
        renderSummary();
        const row = htmlElement("tr", { class: "empty-row" });
        row.append(htmlElement("td", { colspan: "6" }, t("emptyCreators")));
        rowsBody.replaceChildren(row);
        flashTop = false;
        return;
      }
      const rows = ranking.map((variant, index) => ({ variant, rank: index + 1 }));
      if (showDominated.checked) {
        const dominated = eligible.filter((variant) => !frontier.includes(variant));
        rankVariants(dominated, allocation, axes, reference).forEach((variant) => {
          rows.push({ variant, dominator: dominatorOf(variantsById.get(variant.id), eligible, axes) });
        });
      }
      const query = search.value.trim().toLowerCase();
      const shown = rows.filter(({ variant }) => query === ""
        || variant.name.toLowerCase().includes(query)
        || variant.creator.toLowerCase().includes(query));
      const ranges = metricRanges(shown.map(({ variant }) => variant));

      const caption = t(ranking.length === 1 ? "captionOne" : "caption", { count: ranking.length, top: ranking[0].name });
      tableCaption.textContent = query ? t("captionShown", { caption, shown: shown.length }) : caption;
      renderSummary(ranking[0]);

      rowsBody.replaceChildren(...shown.flatMap(({ variant, rank, dominator }, index) => {
        const row = htmlElement("tr", { class: dominator ? "dominated" : rank === 1 ? "top" : "" });
        if (rank === 1 && flashTop) row.classList.add("flash");
        const model = htmlElement("div", { class: "model" });
        const swatch = htmlElement("span", { class: "swatch", style: `background:${variantsById.get(variant.id).color}` });
        const names = htmlElement("span");
        names.append(htmlElement("span", { class: "name" }, variant.name), " ", htmlElement("span", { class: "creator" }, variant.creator));
        if (dominator) names.append(htmlElement("span", { class: "dominator" }, t("dominatedBy", { name: dominator.name })));
        const open = expandedWhy.has(variant.id);
        const toggle = htmlElement("button", {
          type: "button",
          class: "why-toggle",
          "aria-expanded": String(open),
          "aria-controls": `why-${index}`,
          "aria-label": t("whyToggleLabel", { name: variant.name }),
        }, t("whyToggle"));
        names.append(toggle);
        model.append(swatch, names);
        const modelCell = htmlElement("td", { class: "model-cell" });
        modelCell.append(model);
        row.append(
          htmlElement("td", { class: "rank" }, rank ? String(rank) : t("dominatedRank")),
          modelCell,
          ...AXES.map((axis) => metricCell(ranges[axis], variant.metrics[axis], formatMetric[axis](variant.metrics[axis]))),
          htmlElement("td", { class: "regret" }, formatRegret(variant.ranking.worstRegret)),
        );
        const detail = htmlElement("tr", { class: "why-row", id: `why-${index}` });
        const detailCell = htmlElement("td", { colspan: "6" });
        detail.hidden = !open;
        if (open) detailCell.append(whyDetails(variant, dominator, axes));
        detail.append(detailCell);
        toggle.addEventListener("click", () => {
          const expanded = toggle.getAttribute("aria-expanded") !== "true";
          toggle.setAttribute("aria-expanded", String(expanded));
          detail.hidden = !expanded;
          if (expanded) {
            expandedWhy.add(variant.id);
            if (!detailCell.firstChild) detailCell.append(whyDetails(variant, dominator, axes));
          } else {
            expandedWhy.delete(variant.id);
          }
        });
        return [row, detail];
      }));
      flashTop = false;
    }

    const map = document.querySelector(".map");
    const marker = document.querySelector("#marker");
    let press = null;

    function writeHash() {
      const hash = `#${AXES.map((axis) => `${HASH_KEYS[axis]}=${formatPower(allocation[axis])}`).join("&")}`;
      if (location.hash !== hash) history.replaceState(null, "", hash);
    }

    function render() {
      const point = allocationPoint(allocation);
      marker.setAttribute("transform", `translate(${point.x} ${point.y})`);
      cells.forEach((cell) => {
        const active = sameAllocation(cell.allocation, allocation);
        cell.group.classList.toggle("active", active);
        cell.group.setAttribute("aria-pressed", String(active));
      });
      renderTable();
      if (!press) writeHash();
    }

    function setAllocation(next) {
      allocation = next;
      render();
    }

    function focusCell(cell) {
      if (!cell) return;
      focusedCell.group.setAttribute("tabindex", "-1");
      focusedCell = cell;
      cell.group.setAttribute("tabindex", "0");
      cell.group.focus();
    }

    function neighbor(cell, key) {
      const { smart, fast, cheap } = cell.allocation;
      const moves = {
        ArrowLeft: { smart: smart + 1, fast, cheap: cheap - 1 },
        ArrowRight: { smart: smart - 1, fast, cheap: cheap + 1 },
        ArrowUp: smart > cheap ? { smart: smart - 1, fast: fast + 1, cheap } : { smart, fast: fast + 1, cheap: cheap - 1 },
        ArrowDown: smart < cheap ? { smart: smart + 1, fast: fast - 1, cheap } : { smart, fast: fast - 1, cheap: cheap + 1 },
      };
      return moves[key] && cellAt(moves[key]);
    }

    function chooseCell(cell) {
      search.value = "";
      flashTop = true;
      setAllocation({ ...cell.allocation });
    }

    function pointerAllocation(event) {
      const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(map.getScreenCTM().inverse());
      const { smart: a, fast: b, cheap: c } = triangle;
      const area = (b.y - c.y) * (a.x - c.x) + (c.x - b.x) * (a.y - c.y);
      const smart = ((b.y - c.y) * (point.x - c.x) + (c.x - b.x) * (point.y - c.y)) / area;
      const fast = ((c.y - a.y) * (point.x - c.x) + (a.x - c.x) * (point.y - c.y)) / area;
      const weights = [smart, fast, 1 - smart - fast].map((weight) => Math.max(0, weight));
      const steps = TOTAL_POWER / POWER_STEP;
      const exact = weights.map((weight) => weight / weights.reduce((sum, item) => sum + item) * steps);
      const units = exact.map(Math.floor);
      const remainder = steps - units.reduce((sum, item) => sum + item);
      exact.map((value, index) => index)
        .sort((left, right) => (exact[right] - units[right]) - (exact[left] - units[left]))
        .slice(0, remainder)
        .forEach((index) => { units[index] += 1; });
      return Object.fromEntries(AXES.map((axis, index) => [axis, units[index] * POWER_STEP]));
    }

    map.addEventListener("pointerdown", (event) => {
      if (!event.isPrimary || event.button !== 0) return;
      event.preventDefault();
      press = { x: event.clientX, y: event.clientY, dragging: false };
      if (marker.contains(event.target)) return;
      const cell = cells.find((candidate) => candidate.group === event.target.closest(".hex"));
      if (!cell) return;
      focusCell(cell);
      chooseCell(cell);
    });

    window.addEventListener("pointermove", (event) => {
      if (!press || !event.isPrimary) return;
      if (!press.dragging && Math.hypot(event.clientX - press.x, event.clientY - press.y) <= 6) return;
      press.dragging = true;
      const next = pointerAllocation(event);
      if (!sameAllocation(next, allocation)) setAllocation(next);
    });

    ["pointerup", "pointercancel"].forEach((type) => window.addEventListener(type, (event) => {
      if (!press || !event.isPrimary) return;
      press = null;
      writeHash();
    }));

    const summary = document.querySelector(".summary");
    new ResizeObserver(() => {
      document.body.style.paddingBottom = `${summary.offsetHeight}px`;
    }).observe(summary);

    cells.forEach((cell) => {
      cell.group.addEventListener("click", (event) => {
        if (event.detail !== 0) return;
        focusCell(cell);
        chooseCell(cell);
      });
      cell.group.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          chooseCell(cell);
        } else if (event.key.startsWith("Arrow")) {
          event.preventDefault();
          focusCell(neighbor(cell, event.key));
        }
      });
    });

    search.addEventListener("input", renderTable);
    showDominated.addEventListener("change", renderTable);
    window.addEventListener("hashchange", () => setAllocation(parseHash()));

    const creatorCount = document.querySelector("#creator-count");
    const creatorBoxes = creatorNames.map((creator) => {
      const label = htmlElement("label");
      const box = htmlElement("input", { type: "checkbox" });
      box.addEventListener("change", () => {
        const next = new Set(selectedCreators);
        if (box.checked) next.add(creator);
        else next.delete(creator);
        setCreators(next);
      });
      label.append(box, creator);
      document.querySelector("#creator-list").append(label);
      return [creator, box];
    });

    function renderCreators() {
      creatorBoxes.forEach(([creator, box]) => { box.checked = selectedCreators.has(creator); });
      creatorCount.textContent = t("creatorsCount", { selected: selectedCreators.size, total: creatorNames.length });
    }

    function setCreators(next) {
      selectedCreators = new Set(creatorNames.filter((creator) => next.has(creator)));
      eligible = variants.filter((variant) => selectedCreators.has(variant.creator));
      expandedWhy.forEach((id) => {
        if (!selectedCreators.has(variantsById.get(id).creator)) expandedWhy.delete(id);
      });
      writeCreators();
      renderCreators();
      assignWinners();
      placeRegionLabels();
      render();
    }

    document.querySelector("#creators-all").addEventListener("click", () => setCreators(new Set(creatorNames)));
    document.querySelector("#creators-none").addEventListener("click", () => setCreators(new Set()));

    const source = { name: catalog.name, version: catalog.version, date: catalog.generatedAt.slice(0, 10), attribution: catalog.attribution };
    document.querySelector("#source-note").textContent = t(catalog.attribution ? "footerSourceAttributed" : "footerSource", source);

    function paragraph(text, href, linkText) {
      const element = htmlElement("p", {}, text);
      if (href) element.append(" ", htmlElement("a", { href }, linkText));
      return element;
    }

    document.querySelector("#explainer").append(...[
      [t("explainRankingTitle"), t("explainRanking").map((text) => paragraph(text))],
      [t("explainRegretTitle"), t("explainRegret").map((text) => paragraph(text))],
      [t("explainMetricsTitle"), [
        paragraph(t("explainMetricsIntro")),
        ...AXES.map((axis) => {
          const definition = catalog.metricDefinitions[axis];
          return paragraph(t("explainMetric", {
            axis: AXIS_LABELS[axis],
            task: definition.task,
            unit: metricUnit(axis),
            better: t(definition.better === "higher" ? "betterHigher" : "betterLower"),
          }), definition.methodologyUrl, t("methodologyLink"));
        }),
      ]],
      [t("explainDataTitle"), [
        paragraph(
          [t("explainData", source), catalog.attribution && t("explainAttribution", source)].filter(Boolean).join(" "),
          catalog.termsUrl,
          t("termsLink"),
        ),
        paragraph(t("explainEmbedded")),
      ]],
    ].map(([title, paragraphs]) => {
      const section = htmlElement("section");
      section.append(htmlElement("h2", {}, title), ...paragraphs);
      return section;
    }));

    renderCreators();
    assignWinners();
    placeRegionLabels();
    render();
  </script>
</body>
</html>
